name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 构建号：这个工作流每跑一次自增（重跑不变）。electron-builder 写进 Windows 的文件版本（1.0.2.123）和
# macOS 的 CFBundleVersion，程序在「关于」和日志里显示。版本号本身（标签、自动更新比较、文件名）不带它。
env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # 本地 OCR 引擎（Rust）：单元测试、clippy、格式。没有下载模型，真实模型的集成测试会跳过。
      - name: OCR engine tests (Rust)
        run: bun run ocr:test
      - name: End-to-end tests (Playwright + Electron)
        run: bun run test:e2e

  # macOS 上同样跑检查和 E2E：平台相关的代码（窗口按钮、打印、钥匙串、快捷键）两边都要验证。
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: End-to-end tests (Playwright + Electron)
        run: bun run test:e2e

  package:
    needs: check
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # 安装包里的 OCR 扩展静态链接的 ONNX Runtime（/MT）：dist:win 从本仓库的预发布版本下载、核对 SHA-256，
      # 不在这里编（发布它的是 onnxruntime.yml，见 scripts/ocr/build-onnxruntime.ts）。
      # 手机扫码的默认中转地址：代码里不写域名，官方安装包从仓库的 Actions 变量注入（见 electron.vite.config.ts）。
      # check 作业不注入：E2E 要验证「没有默认地址」时的提示。
      - run: bun run dist:win
        env:
          CDL_LABELFLASH_DEFAULT_RELAY_URL: ${{ vars.LABELFLASH_DEFAULT_RELAY_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: CDL-LabelFlash-windows
          path: dist/*.exe
          if-no-files-found: error

  # macOS 的 pkg 安装包（universal，ad-hoc 签名，见 electron-builder.yml）。pkgbuild 只在 macOS 上有。
  package-macos:
    needs: check-macos
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run dist:mac
        env:
          CDL_LABELFLASH_DEFAULT_RELAY_URL: ${{ vars.LABELFLASH_DEFAULT_RELAY_URL }}
          # 不去钥匙串里找证书：没有开发者证书，签名固定用 ad-hoc。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder 在 PR 里默认不签名（防止把证书交给别人的 PR）。这里只有 ad-hoc 签名、不涉及任何证书，
          # 不签的话 PR 打出的包和发布的包不一样，Apple 芯片上也打不开，verify-package 会拦下。
          CSC_FOR_PULL_REQUEST: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: CDL-LabelFlash-macos
          path: dist/*.pkg
          if-no-files-found: error

  # 打 v* 标签时发布，分四步：检查并建草稿 → Windows、macOS 各自上传 → 核对齐全后公开。
  # Windows：electron-builder 上传安装包、latest.yml 和 blockmap，electron-updater 据此自动更新；macOS：只上传 pkg。
  # 先建草稿、上传、核对齐全后再公开：electron-builder 并行上传时，几个上传各自去「建 Release」会互相抢，
  # 1.0.1 就这样丢了 blockmap（下一版的差分更新要用它）；草稿期间客户端也看不到只传了一半的版本。
  release-draft:
    # 两个平台的检查都通过才发布。
    needs: [check, check-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CDL_LABELFLASH_DEFAULT_RELAY_URL: ${{ vars.LABELFLASH_DEFAULT_RELAY_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 要完整历史才能判断标签所在的提交是不是在 master 上。
          fetch-depth: 0
      # 发布前的三道检查：只从 master 发布；标签和 package.json 的版本一致（客户端按版本号比较、按文件名找旧版 blockmap）；
      # 官方安装包必须带默认中转地址，否则手机扫码要用户自己填。
      - name: Check the tag, the version and the build settings
        shell: bash
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::标签 $GITHUB_REF_NAME 指向的提交不在 master 上。先经 PR 合进 master，再在 master 的提交上打标签。"
            exit 1
          fi
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 和 package.json 的版本 $version 不一致。"
            exit 1
          fi
          if [ -z "$CDL_LABELFLASH_DEFAULT_RELAY_URL" ]; then
            echo "::error::仓库的 Actions 变量 LABELFLASH_DEFAULT_RELAY_URL 没有设置，官方安装包会没有默认中转地址。"
            exit 1
          fi
      - name: Create the release as a draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes "CDL-云签速印 ${GITHUB_REF_NAME#v}"

  release-windows:
    needs: release-draft
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # 安装包里的 OCR 扩展静态链接的 ONNX Runtime（/MT）：dist:win 从本仓库的预发布版本下载、核对 SHA-256，
      # 不在这里编（发布它的是 onnxruntime.yml，见 scripts/ocr/build-onnxruntime.ts）。
      - run: bun run release:win
        env:
          CDL_LABELFLASH_DEFAULT_RELAY_URL: ${{ vars.LABELFLASH_DEFAULT_RELAY_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    needs: release-draft
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run dist:mac
        env:
          CDL_LABELFLASH_DEFAULT_RELAY_URL: ${{ vars.LABELFLASH_DEFAULT_RELAY_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # 没有自动更新（见 electron-builder.yml），只传 pkg，由 gh 直接上传到草稿。
      - name: Upload the package to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/CDL-LabelFlash-${GITHUB_REF_NAME#v}.pkg"

  release-publish:
    needs: [release-windows, release-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft once every file is there
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for file in "CDL-LabelFlash-Setup-$version.exe" "CDL-LabelFlash-Setup-$version.exe.blockmap" latest.yml "CDL-LabelFlash-$version.pkg"; do
            if ! grep -qx "$file" <<< "$assets"; then
              echo "::error::Release 草稿缺少 $file，不公开。"
              exit 1
            fi
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      # latest 分支始终指向最新发布的版本：要看、要从源码构建「现在发布的是哪一版」，切到 latest 就行。
      # 只快进（force=false）：标签只打在 master 上、版本只增不减，快进不了说明发错了版本，宁可报错也不把 latest 往回拨。
      # 分支本身有保护（不能删除、不能强推），见 CLAUDE.md「打包、更新与发布」。
      - name: Move the latest branch to this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/heads/latest" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/heads/latest" -f sha="$GITHUB_SHA" -F force=false --silent
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/heads/latest -f sha="$GITHUB_SHA" --silent
          fi
          echo "latest → $GITHUB_REF_NAME ($GITHUB_SHA)"
