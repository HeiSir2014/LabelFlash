# CDL-云签速印 手机扫码中转服务的 nginx 示例。
#
# 放进已有 https 站点的 server 块里（放在 location / 之前），域名和证书用站点自己的。
# 路径前缀可以换；电脑的设置里填的中转地址就是 https://<你的域名>/labelflash/，
# 中转服务的 PUBLIC_ORIGIN 填 https://<你的域名>。

location /labelflash/ {
    # 结尾的 / 去掉路径前缀：中转服务自己的路径是 /m/、/ws/desktop、/ws/phone、/healthz。
    proxy_pass http://127.0.0.1:3180/;

    # WebSocket 升级。
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    # 中转服务按来源 IP 限制连接数。
    proxy_set_header X-Real-IP $remote_addr;

    # 应用层心跳 25 秒一次，读写超时要比它长得多。
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 只有很小的 JSON 帧和静态文件，没有上传。
    client_max_body_size 64k;
}
