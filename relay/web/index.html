<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#18211e" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no" />
    <title>{{productName}} · 手机扫码</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="bar">
      <p class="brand"><span class="brand-mark">{{brandMark}}</span><span class="brand-name">{{productName}}</span></p>
      <p class="printer" id="printer" hidden></p>
    </header>
    <p class="banner" id="link-banner" role="status" hidden></p>
    <p class="visually-hidden" id="announcer" role="status" aria-live="polite"></p>

    <main>
      <section class="screen screen-message" id="screen-message">
        <h1 id="message-title">正在打开…</h1>
        <p id="message-text" hidden></p>
        <button class="button primary" id="message-action" type="button" hidden>刷新页面</button>
      </section>

      <section class="screen screen-scan" id="screen-scan" hidden>
        <div class="viewfinder" id="viewfinder" data-tone="idle">
          <video id="video" playsinline muted></video>
          <div class="frame" aria-hidden="true"><span class="sweep"></span></div>
          <span class="focus-ring" id="focus-ring" aria-hidden="true" hidden></span>
          <div class="cover" id="viewfinder-cover" hidden>
            <p id="cover-text"></p>
            <button class="button primary" id="cover-button" type="button">开始扫码</button>
          </div>
          <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="true">声音：开</button>
          <button class="lens" id="lens" type="button" aria-pressed="false" hidden>焦段：近</button>
          <button class="torch" id="torch" type="button" aria-pressed="false" hidden>开手电筒</button>
        </div>
        <p class="hint" id="scan-hint"></p>
        <p class="hint hint-extra" id="scan-hint-extra" role="status" hidden></p>
        <ol class="jobs" id="jobs" aria-label="打印任务"></ol>
        <div class="fallback">
          <div id="photo-control">
            <label class="button" for="photo">拍照识别</label>
            <input class="visually-hidden" id="photo" type="file" accept="image/*" capture="environment" />
          </div>
          <form class="manual" id="manual" autocomplete="off">
            <label class="visually-hidden" for="manual-input">手动输入扫码内容</label>
            <input
              id="manual-input"
              type="text"
              enterkeyhint="go"
              maxlength="{{maxRawLength}}"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              placeholder="或者手动输入内容"
            />
            <button class="button" type="submit">打印</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
